services:
  db:
    image: postgres:16-alpine
    container_name: peter-solution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peter
      POSTGRES_PASSWORD: peter
      POSTGRES_DB: peter_solution
    ports:
      - "5432:5432"
    volumes:
      - peter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peter -d peter_solution"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  peter-pgdata:
